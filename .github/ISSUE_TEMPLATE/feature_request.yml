name: Feature Request
description: File a feature request
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - UlionTse
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!
  - type: textarea
    id: motivation
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? Why do you need it?
      placeholder: "I'm trying to ... but exejs currently can't ..."
    validations:
      required: true
  - type: textarea
    id: proposed-api
    attributes:
      label: Proposed API
      description: Sketch the Python interface you'd like to see. This will be automatically formatted as Python, so no need for backticks.
      render: python
      placeholder: |
        exejs.execute(source, timeout=..., new_option=...)
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you tried?
      placeholder: "I tried ... but it doesn't work because ..."
    validations:
      required: false
  - type: dropdown
    id: js-runtime
    attributes:
      label: JS Runtime (if applicable)
      description: Is this feature specific to a particular JS runtime? Leave as N/A if it applies to all.
      options:
        - "N/A (not runtime-specific)"
        - Node
        - JavaScriptCore
        - SpiderMonkey
        - JScript
        - Phantomjs
        - SlimerJS
        - Nashorn
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: License Agreement
      description: By submitting this issue, you agree to follow our [License](https://github.com/UlionTse/exejs/blob/main/LICENSE)
      options:
        - label: I agree to follow this project's License
          required: true
