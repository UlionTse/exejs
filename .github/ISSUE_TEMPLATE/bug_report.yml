name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
assignees:
  - UlionTse
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: What did you do? Provide the smallest sequence that triggers the issue.
      placeholder: |
        1. import exejs
        2. exejs.evaluate("...")
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Expected vs actual behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: "Expected: ...; Actual: ..."
    validations:
      required: true
  - type: textarea
    id: repro-code
    attributes:
      label: Minimal reproduction code
      description: Smallest Python snippet that reproduces the issue. This will be automatically formatted as Python, so no need for backticks.
      render: python
      placeholder: |
        import exejs
        exejs.evaluate("1 + 1")
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: exejs Version
      description: Run `python -c "import exejs; print(exejs.__version__)"` if unsure.
      placeholder: "e.g. 1.0.0"
    validations:
      required: true
  - type: dropdown
    id: python-version
    attributes:
      label: Python Version
      description: What version of Python are you running?
      options:
        - "3.9"
        - "3.10"
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
    validations:
      required: true
  - type: dropdown
    id: js-runtime
    attributes:
      label: JS Runtime
      description: Which JavaScript runtime did exejs pick (or did you select via reset_runtime)? Run `python -c "import exejs; print(exejs.get_current_runtime_name())"` if unsure.
      options:
        - Node
        - JavaScriptCore
        - SpiderMonkey
        - JScript
        - Phantomjs
        - SlimerJS
        - Nashorn
        - Unknown / not sure
    validations:
      required: true
  - type: input
    id: js-runtime-version
    attributes:
      label: JS Runtime Version
      description: Output of `node --version`, `js --version`, etc.
      placeholder: "e.g. node v20.11.0"
    validations:
      required: false
  - type: dropdown
    id: runtime-environment
    attributes:
      label: Operating System
      description: What OS are you running on?
      options:
        - Linux
        - Windows
        - macOS
        - WSL
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output or Python traceback. This will be automatically formatted as Python, so no need for backticks.
      render: python
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: License Agreement
      description: By submitting this issue, you agree to follow our [License](https://github.com/UlionTse/exejs/blob/main/LICENSE)
      options:
        - label: I agree to follow this project's License
          required: true
